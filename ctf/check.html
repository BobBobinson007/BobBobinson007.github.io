<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e11;
    --panel:#12161b;
    --border:#1f252c;
    --border-focus:#2c3742;
    --text:#e6e9ec;
    --text-dim:#6b7480;
    --accent:#3ecf8e;
    --danger:#f0665e;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100dvh;
    background:var(--bg);
    font-family:var(--font);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;
    padding:20px;
  }
  .card{
    width:100%;max-width:380px;
    padding:26px 24px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
  }
  label{
    display:block;
    font-size:11px;font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  input#i{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-family:var(--font);
    font-size:16px;
    color:var(--text);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input#i::placeholder{color:var(--text-dim);}
  input#i:focus{border-color:var(--border-focus);}

  button{
    position:relative;
    width:100%;
    margin-top:12px;
    background:var(--accent);
    border:none;
    border-radius:8px;
    padding:12px 14px;
    font-family:var(--font);
    font-size:14px;font-weight:600;
    color:#06120c;
    cursor:pointer;
    transition:opacity .15s ease, transform .05s ease;
  }
  button:hover{opacity:.9;}
  button:active{transform:scale(0.99);}

  #btnLabel{
    display:block;
    transition:opacity .15s ease;
  }

  .card.shake{animation:shake .35s ease;}
  @keyframes shake{
    20%{transform:translateX(-4px);}
    40%{transform:translateX(4px);}
    60%{transform:translateX(-3px);}
    80%{transform:translateX(3px);}
    100%{transform:translateX(0);}
  }

  #i.ok-glow{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(62,207,142,0.15);
  }
  #i.bad-glow{
    border-color:var(--danger);
    box-shadow:0 0 0 3px rgba(240,102,94,0.15);
  }

  #r{
    margin-top:0;
    max-height:0;
    font-size:13px;
    font-weight:500;
    overflow:hidden;
    transition:max-height .2s ease, margin-top .2s ease;
  }
  #r.bad{
    margin-top:10px;
    max-height:20px;
    color:var(--danger);
  }

  .checkIcon{
    position:absolute;
    left:50%;top:50%;
    display:flex;align-items:center;justify-content:center;
    width:18px;height:18px;
    border-radius:50%;
    background:#06120c;
    opacity:0;
    transform:translate(-50%,-50%) scale(0.5);
    transition:opacity .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
  }
  .checkIcon.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .checkIcon svg{width:11px;height:11px;}

  @media (max-width: 420px){
    .card{padding:26px 20px;border-radius:10px;}
  }
</style>
</head>
<body>
<div class="card" id="card">
  <label for="i">Flag</label>
  <input id="i" type="text" placeholder="FLAG{...}" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') check();">
  <button id="btn" onclick="check()">
    <span id="btnLabel">Prüfen</span>
    <span class="checkIcon" id="checkIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </span>
  </button>
  <p id="r"></p>
</div>

<script>
async function check() {
  const input = document.getElementById('i');
  const val = input.value;
  const enc = new TextEncoder().encode(val);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  const target = "688bc7272379513070954984fdabfa55240f5c28e96932ff59f503674bf340a9";

  const r = document.getElementById('r');
  const card = document.getElementById('card');
  const btnLabel = document.getElementById('btnLabel');
  const checkIcon = document.getElementById('checkIcon');

  r.className = "";
  r.textContent = "";
  input.classList.remove('ok-glow', 'bad-glow');
  checkIcon.classList.remove('show');
  card.classList.remove('shake');
  btnLabel.style.opacity = 1;

  if (hex === target) {
    input.classList.add('ok-glow');
    btnLabel.style.opacity = 0;
    checkIcon.classList.add('show');
    playSuccess();
  } else {
    input.classList.add('bad-glow');
    r.textContent = "Falsch. Versuch es erneut.";
    r.classList.add("bad");
    void card.offsetWidth;
    card.classList.add('shake');
    setTimeout(() => input.classList.remove('bad-glow'), 600);
  }
}

function playSuccess() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const notes = [523.25, 659.25, 783.99];
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const start = ctx.currentTime + i * 0.12;
    gain.gain.setValueAtTime(0.2, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
    osc.start(start);
    osc.stop(start + 0.3);
  });
}
</script>
</body>
</html>
