<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Check</title>
<style>
  :root{
    --bg:#0a0e0d;
    --panel:#0f1512;
    --line:#1c2a22;
    --text:#9db8a8;
    --text-dim:#5c7167;
    --green:#4ade80;
    --amber:#e8b34c;
    --red:#ff5f56;
    --font: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #10201a 0%, var(--bg) 60%);
    font-family:var(--font);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:560px;padding:24px;}

  .term{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 20px 60px -20px rgba(0,0,0,.8), inset 0 0 40px rgba(74,222,128,0.02);
    overflow:hidden;
    position:relative;
  }
  .term::after{
    content:"";
    position:absolute;inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }
  .titlebar{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;
    background:#0c120f;
    border-bottom:1px solid var(--line);
  }
  .dot{width:10px;height:10px;border-radius:50%;opacity:.85;}
  .dot.r{background:var(--red);}
  .dot.y{background:var(--amber);}
  .dot.g{background:var(--green);}
  .titlebar span{
    margin-left:auto;margin-right:auto;
    font-size:11px;letter-spacing:.12em;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  .body{padding:28px 26px 30px;}

  .eyebrow{
    font-size:11px;letter-spacing:.18em;color:var(--text-dim);
    text-transform:uppercase;margin:0 0 6px;
  }
  h1{
    margin:0 0 22px;
    font-size:20px;font-weight:600;color:#e8f5ee;
    letter-spacing:.01em;
  }
  h1 .caret{
    display:inline-block;width:10px;height:1.1em;background:var(--green);
    margin-left:6px;vertical-align:-2px;
    animation:blink 1.1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .prompt-row{
    display:flex;align-items:center;gap:10px;
    background:#0a100c;
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    transition:border-color .2s ease;
  }
  .prompt-row:focus-within{border-color:#2b4237;}
  .prompt-row .sym{color:var(--green);font-weight:600;flex-shrink:0;}
  input#i{
    flex:1;
    background:transparent;border:none;outline:none;
    font-family:var(--font);font-size:14px;color:#e8f5ee;
    caret-color:var(--green);
    min-width:0;
  }
  input#i::placeholder{color:var(--text-dim);}

  button{
    margin-top:14px;width:100%;
    background:transparent;
    border:1px solid #2b4237;
    color:var(--green);
    font-family:var(--font);font-size:13px;letter-spacing:.06em;
    text-transform:uppercase;
    padding:11px 14px;border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .05s ease;
  }
  button:hover{background:rgba(74,222,128,0.08);border-color:#3d5c4c;}
  button:active{transform:scale(0.99);}

  #r{
    margin:16px 0 0;
    min-height:20px;
    font-size:14px;
    display:flex;align-items:center;gap:8px;
  }
  #r::before{content:"$";color:var(--text-dim);}
  #r.ok{color:var(--green);}
  #r.bad{color:var(--red);}

  .foot{
    margin-top:22px;padding-top:16px;
    border-top:1px dashed var(--line);
    font-size:11px;color:var(--text-dim);
    display:flex;justify-content:space-between;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="term">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span>flag_check.sh</span>
    </div>
    <div class="body">
      <p class="eyebrow">Verification</p>
      <h1>Flag eingeben<span class="caret"></span></h1>

      <div class="prompt-row">
        <span class="sym">&gt;</span>
        <input id="i" type="text" placeholder="FLAG{...}" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') check();">
      </div>
      <button onclick="check()">Prüfen</button>

      <p id="r"></p>

      <div class="foot">
        <span>sha256 · client-side</span>
        <span id="status">bereit</span>
      </div>
    </div>
  </div>
</div>

<script>
async function check() {
  const val = document.getElementById('i').value;
  const enc = new TextEncoder().encode(val);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  const target = "688bc7272379513070954984fdabfa55240f5c28e96932ff59f503674bf340a9";
  const r = document.getElementById('r');
  const status = document.getElementById('status');
  r.className = "";
  if (hex === target) {
    r.textContent = "Richtig — Flag akzeptiert.";
    r.classList.add("ok");
    status.textContent = "verified";
    playSuccess();
  } else {
    r.textContent = "Falsch — Hash stimmt nicht überein.";
    r.classList.add("bad");
    status.textContent = "abgelehnt";
  }
}

function playSuccess() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const notes = [523.25, 659.25, 783.99]; // C5 E5 G5
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const start = ctx.currentTime + i * 0.12;
    gain.gain.setValueAtTime(0.2, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
    osc.start(start);
    osc.stop(start + 0.3);
  });
}
</script>
</body>
</html>
